name: Keep API warm

# Render's free web services sleep after ~15 minutes without traffic and take
# ~50 s to wake. Pinging /health every 10 minutes keeps the demo API responsive
# for anyone who clones the repo and runs the app.
# (GitHub may delay scheduled runs a little, and pauses schedules in public repos
#  after 60 days without commits — re-enable from the Actions tab if that happens.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -sS --max-time 120 --retry 2 https://quickbite-api-0zul.onrender.com/health
