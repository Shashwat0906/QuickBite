name: Generate Prisma migration

# Run manually after changing schema.prisma when you have no local Prisma CLI:
# it diffs the existing migrations against the schema and commits a new one.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name (snake_case)
        required: true
        default: init

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: quickbite, POSTGRES_PASSWORD: quickbite, POSTGRES_DB: shadow }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U quickbite" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        env: { DATABASE_URL: postgresql://quickbite:quickbite@localhost:5432/shadow }
      - name: Diff migrations → schema
        run: |
          dir="prisma/migrations/$(date -u +%Y%m%d%H%M%S)_${{ github.event.inputs.name }}"
          mkdir -p prisma/migrations "$dir"
          [ -f prisma/migrations/migration_lock.toml ] || printf '# Please do not edit this file manually\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          if ls prisma/migrations/*/migration.sql >/dev/null 2>&1; then FROM="--from-migrations prisma/migrations --shadow-database-url postgresql://quickbite:quickbite@localhost:5432/shadow"; else FROM="--from-empty"; fi
          npx prisma migrate diff $FROM --to-schema-datamodel prisma/schema.prisma --script > "$dir/migration.sql"
          if ! grep -qE '^(CREATE|ALTER|DROP)' "$dir/migration.sql"; then echo "No schema changes"; rm -rf "$dir"; fi
      - name: Commit
        working-directory: .
        run: |
          git config user.name "Shashwat0906"
          git config user.email "151515567+Shashwat0906@users.noreply.github.com"
          git add backend/prisma/migrations
          git diff --cached --quiet && exit 0
          git commit -m "chore(db): add Prisma migration ${{ github.event.inputs.name }}"
          git push
