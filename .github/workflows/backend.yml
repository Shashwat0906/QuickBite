name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    name: Lint + unit + integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quickbite
          POSTGRES_PASSWORD: quickbite
          POSTGRES_DB: quickbite_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quickbite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://quickbite:quickbite@localhost:5432/quickbite_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Create schema and seed test database
        run: npm run test:prepare

      - name: Integration tests (real PostgreSQL + Socket.IO)
        run: npm run test:integration

      - name: Generate migration SQL from schema (artifact)
        run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > migration.sql

      - uses: actions/upload-artifact@v4
        with:
          name: migration-sql
          path: backend/migration.sql
