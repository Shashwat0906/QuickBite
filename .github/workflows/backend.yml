name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    name: Lint + unit + integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quickbite
          POSTGRES_PASSWORD: quickbite
          POSTGRES_DB: quickbite_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quickbite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://quickbite:quickbite@localhost:5432/quickbite_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit.log
          echo "::notice title=Unit tests::$(grep -E '^# (tests|pass|fail)' unit.log | tr '\n' ' ')"

      - name: Create schema and seed test database
        run: npm run test:prepare

      - name: Integration tests (real PostgreSQL + Socket.IO)
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration.log
          echo "::notice title=Integration tests::$(grep -E '^# (tests|pass|fail)' integration.log | tr '\n' ' ')"

      - name: Migrations are in sync with schema.prisma
        run: |
          psql "postgresql://quickbite:quickbite@localhost:5432/quickbite_test" -c "CREATE DATABASE quickbite_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://quickbite:quickbite@localhost:5432/quickbite_shadow --exit-code
